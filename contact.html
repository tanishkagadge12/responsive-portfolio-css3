<main
id="main-content"
role="main">

<section class="section">

<div class="container">

<form aria-label="Contact Form">

<label for="name">
Full Name
</label>

<input
id="name"
name="name"
type="text"
required
aria-required="true">

<label for="email">
Email Address
</label>

<input
id="email"
name="email"
type="email"
required
aria-required="true">

<label for="message">
Message
</label>

<textarea
id="message"
name="message"
rows="6"
required
aria-required="true">
</textarea>

<button type="submit">
Send Message
</button>

</form>

</div>

</section>
